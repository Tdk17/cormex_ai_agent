<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="CormeX CRM — gestão comercial, leads, conversas, pipeline, follow-ups e automação de vendas com IA.">
  <meta name="theme-color" content="#071A2E">
  <meta name="color-scheme" content="light">
  <meta name="google-site-verification" content="ByesghzQafSVSf8hqZlv0ICwmj_yARMo1c3dKDqmZGE" />
  <link rel="canonical" href="https://cormexcrm.com.br/">
  <link rel="privacy-policy" href="https://cormexcrm.com.br/privacy.html">

  <!-- PWA / Android -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="CormeX CRM">

  <!-- PWA / iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CormeX">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CormeX CRM</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Links legais mantidos no HTML base, além do conteúdo Flutter, para que
    verificadores externos (como o Google OAuth Branding) consigam localizar
    Política de Privacidade e Termos diretamente na página inicial.
  -->
  <style>
    #cormex-legal-links {
      position: fixed;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      z-index: 2147483647;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 13px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 999px;
      background: rgba(3,7,18,.88);
      box-shadow: 0 8px 30px rgba(0,0,0,.28);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      font: 600 11px/1.2 Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      white-space: nowrap;
    }

    #cormex-legal-links a {
      color: #cbd5e1;
      text-decoration: none;
    }

    #cormex-legal-links a:hover,
    #cormex-legal-links a:focus-visible {
      color: #67e8f9;
      text-decoration: underline;
    }

    #cormex-legal-links .separator {
      color: rgba(255,255,255,.28);
    }

    @media (max-width: 520px) {
      #cormex-legal-links {
        bottom: 8px;
        max-width: calc(100vw - 20px);
        padding: 7px 11px;
        font-size: 10px;
      }
    }
  </style>
</head>
<body>
  <noscript>O CormeX CRM precisa de JavaScript habilitado para funcionar.</noscript>

  <nav id="cormex-legal-links" aria-label="Links legais do CormeX CRM">
    <a href="https://cormexcrm.com.br/privacy.html">Política de Privacidade</a>
    <span class="separator" aria-hidden="true">•</span>
    <a href="https://cormexcrm.com.br/terms.html">Termos de Serviço</a>
  </nav>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
